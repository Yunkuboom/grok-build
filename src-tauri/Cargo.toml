[package]
name="grok-builder-desktop"
version="0.1.0"
description="Native desktop UI for Grok Build"
authors= ["Grok Build Desktop"]
edition="2021"
[lib]
name="grok_builder_desktop_lib"
crate-type= ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build= {version="2",features= [] }
[dependencies]
tauri= {version="2",features= ["protocol-asset"] }
tauri-plugin-dialog="2"
serde= {version="1",features= ["derive"] }
serde_json="1"
tokio= {version="1",features= ["process", "io-util", "sync", "macros", "rt-multi-thread", "time", "net"] }
dirs="5"
thiserror="1"
uuid= {version="1",features= ["v4"] }
regex="1"
portable-pty="0.9"
base64="0.22"
axum= {version="0.8",default-features=false,features= ["http1", "tokio", "query", "json", "ws"] }
tower-http= {version="0.6",features= ["fs"] }
futures-util= {version="0.3",default-features=false,features= ["sink"] }
reqwest= {version="0.12",default-features=false,features= ["rustls-tls"] }
if-addrs="0.13"
qrcode="0.14"
rand="0.8"
